apiVersion: v1
kind: Pod
metadata:
  name: hog-1
spec:
  runtimeClassName: nvidia
  restartPolicy: Never
  # python corre como PID 1 y no maneja SIGTERM: sin esto el pod queda ~30 s en Terminating
  terminationGracePeriodSeconds: 0
  containers:
  - name: hog
    image: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime
    env:
    - name: GB
      value: "2.2"
    command: ["python", "-c"]
    args:
    - |
      import os, time, torch
      gb = float(os.environ["GB"])
      x = torch.empty(int(gb * 1024**3), dtype=torch.uint8, device="cuda")
      print(f"Reservados {torch.cuda.memory_allocated()/1024**3:.2f} GB", flush=True)
      time.sleep(3600)
    resources:
      limits:
        nvidia.com/gpu: 1
