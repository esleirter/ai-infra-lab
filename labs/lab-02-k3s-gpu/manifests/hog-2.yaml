apiVersion: v1
kind: Pod
metadata:
  name: hog-2
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
  - name: hog
    image: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime
    command: ["python", "-c"]
    args:
    - |
      import torch, time
      x = torch.empty(int(2.2 * 1024**3 // 2), dtype=torch.float16, device='cuda')
      print(f"OK - reservado {torch.cuda.memory_allocated()/1024**3:.2f} GB", flush=True)
      time.sleep(3600)
    resources:
      limits:
        nvidia.com/gpu: 1
