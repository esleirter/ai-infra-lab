apiVersion: v1
kind: Pod
metadata:
  name: burn
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
  - name: burn
    image: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime
    command: ["python", "-c"]
    args:
    - |
      import torch
      a = torch.randn(4096, 4096, device='cuda', dtype=torch.float16)
      print("quemando", flush=True)
      while True:
          a = (a @ a) / a.abs().max()
          torch.cuda.synchronize()
    resources:
      limits:
        nvidia.com/gpu: 1
